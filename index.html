<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Bot Arena</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <!-- Custom Lens Blur Titlebar -->
  <header class="titlebar">
    <div class="titlebar-left">
      <div class="logo-badge">
        <div class="scarlet-crystal-icon">
          <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
            <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
          </svg>
        </div>
        <span>Multi-Bot Arena</span>
      </div>
    </div>

    <div class="titlebar-center">
      <div class="layout-btn-group" id="layout-btn-group">
        <!-- Rendered with crisp SVGs & tooltips by Titlebar.js -->
      </div>
    </div>

    <div class="titlebar-right">
      <button class="window-ctrl-btn icon-only" id="btn-minimize" title="Minimize"></button>
      <button class="window-ctrl-btn icon-only" id="btn-maximize" title="Maximize"></button>
      <button class="window-ctrl-btn icon-only close" id="btn-close" title="Close"></button>
    </div>
  </header>

  <!-- Secondary Navigation Strip: Bot Toggles & Actions -->
  <nav class="bot-nav-strip">
    <div class="bot-selector-pills" id="bot-pills-container">
      <!-- Dynamic Brand Pills Rendered by JS -->
    </div>

    <div class="strip-actions" id="strip-actions">
      <!-- Compare, Reload All, Toggle All SVGs Rendered by BotNav.js -->
    </div>
  </nav>

  <!-- Main Multi-Webview Grid Container (Default: Hexa 2x3 Grid) -->
  <main class="views-container layout-hexa" id="views-container">
    <!-- Dynamic Bot Cards & Webviews Rendered by JS -->
  </main>

  <!-- Bottom Master Dock: Prompt Broadcasting & Benchmark -->
  <footer class="bottom-dock" id="bottom-dock">
    <div class="broadcast-targets">
      <div class="target-checkboxes" id="target-checkboxes">
        <!-- Target checkboxes with brand SVGs rendered dynamically -->
      </div>

      <div class="prompt-presets-container">
        <select id="preset-select" class="preset-select" title="Select a benchmark prompt preset">
          <option value="">Presets...</option>
          <option value="Compare the architectural trade-offs between monolithic and microservices architectures with real-world examples.">Microservices vs Monoliths</option>
          <option value="Write a production-ready TypeScript function that implements exponential backoff retry for network requests.">TypeScript Exponential Backoff</option>
          <option value="Explain quantum entanglement and quantum computing superposition to a high schooler.">Quantum Computing Intro</option>
          <option value="What are the biggest technological breakthroughs in AI reasoning models over the past 12 months?">AI Reasoning State of Art</option>
        </select>
      </div>
    </div>

    <div class="input-row">
      <textarea
        id="master-prompt-input"
        class="master-textarea"
        placeholder="Type a master prompt to broadcast across all models... (Ctrl + Enter to send)"
        rows="2"
      ></textarea>

      <div class="action-buttons-group">
        <button id="btn-broadcast" class="send-btn" title="Broadcast prompt (Ctrl + Enter)">
          <!-- Rendered by JS -->
        </button>
        <button id="btn-clear" class="clear-btn icon-only" title="Clear prompt">
          <!-- Rendered by JS -->
        </button>
      </div>
    </div>

    <div class="benchmark-stats">
      <div class="stat-pill" id="stat-status">Ready</div>
      <div class="stat-pill" id="stat-timer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><circle cx="12" cy="13" r="8"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="2" x2="12" y2="5"/></svg>
        <span>0.0s</span>
      </div>
    </div>
  </footer>

  <!-- Modular ES Module Entry Point -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
