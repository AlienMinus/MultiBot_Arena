<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240712"/>
      <stop offset="50%" stop-color="#140409"/>
      <stop offset="100%" stop-color="#080204"/>
    </linearGradient>

    <!-- Scarlet Flame Radiant Glow -->
    <radialGradient id="scarletGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff2a5f" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#be123c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090204" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Rim Specular Bevel -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 120, 160, 0.7)"/>
      <stop offset="50%" stop-color="rgba(255, 42, 95, 0.3)"/>
      <stop offset="100%" stop-color="rgba(80, 10, 30, 0.5)"/>
    </linearGradient>

    <!-- Hex Crystal Gradients -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="100%" stop-color="#ff2a5f"/>
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fed7e2"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>

    <!-- Drop Shadow for Crystal -->
    <filter id="liquidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ff2a5f" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Ambient Liquid Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#scarletGlow)"/>

  <!-- Specular Outer Glass Rim -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>
  
  <!-- Subtle Top Edge Glass Sheen -->
  <path d="M 64 20 Q 256 30 448 20" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Central Multi-Bot Arena Hexagon Core (6 Nodes = 6 AI Titans) -->
  <g filter="url(#liquidShadow)">
    <!-- Node Ring / Connection Orbits -->
    <polygon points="256,110 376,179 376,317 256,386 136,317 136,179" 
             fill="none" 
             stroke="rgba(255, 60, 100, 0.25)" 
             stroke-width="4"
             stroke-dasharray="8 6"/>

    <!-- Six AI Pillars / Hexagonal Facets -->
    <!-- Top-Right Facet (Claude / OpenAI) -->
    <polygon points="256,140 350,195 256,256" fill="url(#facetTop)" opacity="0.95"/>
    
    <!-- Right Facet (Gemini / Perplexity) -->
    <polygon points="350,195 350,305 256,256" fill="url(#facetRight)" opacity="0.9"/>
    
    <!-- Bottom-Right Facet (Grok) -->
    <polygon points="350,305 256,360 256,256" fill="url(#facetLeft)" opacity="0.85"/>
    
    <!-- Bottom-Left Facet (DeepSeek) -->
    <polygon points="256,360 162,305 256,256" fill="url(#facetRight)" opacity="0.8"/>
    
    <!-- Left Facet -->
    <polygon points="162,305 162,195 256,256" fill="url(#facetLeft)" opacity="0.9"/>
    
    <!-- Top-Left Facet -->
    <polygon points="162,195 256,140 256,256" fill="url(#facetTop)" opacity="0.95"/>

    <!-- Inner Refraction Wireframe -->
    <polygon points="256,140 350,195 350,305 256,360 162,305 162,195" 
             fill="none" 
             stroke="rgba(255, 255, 255, 0.5)" 
             stroke-width="2.5"/>

    <!-- The 6 Satellite Node Orbs (One for each bot) -->
    <circle cx="256" cy="110" r="10" fill="#e06847" stroke="#fff" stroke-width="2"/> <!-- Claude -->
    <circle cx="376" cy="179" r="10" fill="#10a37f" stroke="#fff" stroke-width="2"/> <!-- ChatGPT -->
    <circle cx="376" cy="317" r="10" fill="#9366ff" stroke="#fff" stroke-width="2"/> <!-- Gemini -->
    <circle cx="256" cy="386" r="10" fill="#3d68ff" stroke="#fff" stroke-width="2"/> <!-- DeepSeek -->
    <circle cx="136" cy="317" r="10" fill="#ff2d55" stroke="#fff" stroke-width="2"/> <!-- Grok -->
    <circle cx="136" cy="179" r="10" fill="#14b8a6" stroke="#fff" stroke-width="2"/> <!-- Perplexity -->

    <!-- Central Radiant Spark / Unified Synthesis Core -->
    <g filter="url(#coreGlow)">
      <!-- 4-Point Diamond Flare -->
      <path d="M 256 195 Q 256 256 317 256 Q 256 256 256 317 Q 256 256 195 256 Q 256 256 256 195 Z" 
            fill="url(#facetCenter)"/>
      <circle cx="256" cy="256" r="11" fill="#ffffff"/>
      <circle cx="256" cy="256" r="6" fill="#ff2a5f"/>
    </g>
  </g>

  <!-- Specular Lens Glint on Diamond -->
  <polygon points="256,215 264,256 256,297 248,256" fill="#ffffff" opacity="0.8"/>
  <polygon points="215,256 256,264 297,256 256,248" fill="#ffffff" opacity="0.8"/>
</svg>

